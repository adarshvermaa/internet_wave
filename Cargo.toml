[package]
name = "internet_wave"
version = "0.1.0"
edition = "2021"
description = "WiFi Wave — Animated network device visualizer for your terminal"

[[bin]]
name = "wifi-wave"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
ipnetwork = "0.20"
dns-lookup = "2"
libc = "0.2"
